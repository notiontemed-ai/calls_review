# Приложение «Контроль звонков» — фрагмент конфигурации nginx.
# ПРИМЕНИТЬ В КОНФИГЕ ХОСТИНГА: nginx не читает .htaccess, поэтому правила из
# .htaccess здесь продублированы. Файл в репозитории — только образец.
#
# /internal/calls-review-web/ — плейсхолдер: замените на реальный путь, по которому
# приложение доступно на сайте (каталог с index.php относительно корня сайта).
#
# Смысл: index.html и все не-файловые пути должны проходить через index.php —
# именно он подставляет ?v=<filemtime> к app.css/app.js и отдаёт html с
# Cache-Control: no-cache. Иначе браузер (и DDoS-Guard) продолжит держать
# старый index.html со ссылками без версий.

location /internal/calls-review-web/ {
    # index.html и все не-файловые пути — через index.php (там подставляются версии статики)
    try_files $uri /internal/calls-review-web/index.php$is_args$args;

    location ~ /internal/calls-review-web/index\.html$ {
        rewrite ^ /internal/calls-review-web/index.php last;
    }

    # Служебные файлы не отдавать
    location ~ /internal/calls-review-web/(config|service-account|src/|storage/|n8n/|apps_script/) {
        deny all;
    }
}
